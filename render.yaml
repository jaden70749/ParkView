services:
  - type: web
    name: parkview-plan-api
    runtime: python
    plan: free
    buildCommand: python3 -m compileall -q edge_api.py
    startCommand: python3 edge_api.py
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: GEMINI_FALLBACK_MODELS
        value: gemini-2.5-flash-lite
      - key: GEMINI_RETRY_ATTEMPTS
        value: 2
      - key: PARKVIEW_ALLOWED_ORIGINS
        value: https://jaden70749.github.io
      - key: PARKVIEW_AI_RATE_LIMIT
        value: 30
      - key: PARKVIEW_AI_RATE_WINDOW
        value: 600
