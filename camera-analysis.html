<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f8c400">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="ParkView">
  <title>현장 카메라 분석 | ParkView</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="stylesheet" href="./camera-analysis.css?v=1">
</head>
<body>
  <main class="camera-analysis-shell">
    <header class="analysis-header">
      <a class="back-button" href="./" aria-label="ParkView로 돌아가기">‹</a>
      <span class="brand-mark" aria-hidden="true">P</span>
      <div class="header-copy">
        <small>ParkView Vision</small>
        <h1>현장 카메라 분석</h1>
      </div>
      <span id="modelBadge" class="model-badge">모델 준비 중</span>
    </header>

    <section class="camera-toolbar" aria-label="카메라 입력 선택">
      <button id="startCameraButton" class="primary-command" type="button">카메라 시작</button>
      <button id="switchCameraButton" class="secondary-command" type="button" disabled>전·후면 전환</button>
      <label class="secondary-command file-command" for="sourceFile">사진·영상 선택</label>
      <input id="sourceFile" type="file" accept="image/*,video/*">
      <button id="stopButton" class="stop-command" type="button" disabled>분석 중지</button>
    </section>

    <section class="analysis-viewport" aria-label="실시간 차량 감지 화면">
      <video id="sourceVideo" playsinline muted></video>
      <img id="sourceImage" alt="선택한 분석 이미지">
      <canvas id="resultCanvas" width="1280" height="720"></canvas>
      <div id="viewportPlaceholder" class="viewport-placeholder">
        <strong>카메라 대기 중</strong>
        <span>카메라 시작 또는 사진·영상을 선택하세요.</span>
      </div>
      <span id="sourceBadge" class="source-badge" hidden>기기 카메라</span>
    </section>

    <p id="analysisStatus" class="analysis-status" role="status" aria-live="polite">
      AI 모델을 불러오고 있습니다.
    </p>

    <section class="analysis-metrics" aria-label="분석 결과">
      <div>
        <span>감지 차량</span>
        <strong id="vehicleCount">0대</strong>
      </div>
      <div>
        <span>분석 시간</span>
        <strong id="inferenceTime">-</strong>
      </div>
      <div>
        <span>처리 방식</span>
        <strong>기기 내 AI</strong>
      </div>
    </section>

    <section class="analysis-settings">
      <label for="confidenceRange">
        <span>감지 기준</span>
        <strong id="confidenceValue">25%</strong>
      </label>
      <input id="confidenceRange" type="range" min="15" max="75" step="5" value="25">
    </section>
  </main>

  <script src="./vendor/onnxruntime/ort.min.js?v=1"></script>
  <script type="module" src="./camera-analysis.js?v=1"></script>
</body>
</html>
