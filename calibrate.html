<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f8c400">
  <title>ParkView CCTV 주차면 등록</title>
  <link rel="stylesheet" href="./calibrate.css?v=2">
</head>
<body>
  <main class="calibration-shell">
    <header>
      <span class="brand-mark" aria-hidden="true">P</span>
      <div><p>ParkView Setup</p><h1>CCTV 주차면 등록</h1></div>
      <span class="setup-badge">설치 전용</span>
    </header>

    <section class="source-section">
      <label class="token-field">관리자 토큰<input id="adminToken" type="password" autocomplete="off"></label>
      <div class="source-actions">
        <label class="file-button" for="frameFile">사진 선택</label>
        <input id="frameFile" type="file" accept="image/*">
        <button id="cameraFrameButton" class="camera-button" type="button">CCTV 프레임 불러오기</button>
        <button id="detectButton" class="camera-button" type="button">구획선으로 주차면 찾기</button>
        <button id="reloadRegionsButton" class="file-button" type="button">저장된 좌표 불러오기</button>
      </div>
      <p id="sourceStatus" role="status" aria-live="polite">프레임을 불러오면 등록을 시작합니다.</p>
    </section>

    <section class="canvas-section">
      <div class="kind-control" aria-label="좌표 편집 모드">
        <button data-mode="region" aria-pressed="true" type="button">감지 구역 선택</button>
        <button data-mode="add" aria-pressed="false" type="button">주차칸 추가</button>
        <button data-mode="edit" aria-pressed="false" type="button">꼭짓점 수정</button>
        <button data-mode="match" aria-pressed="false" type="button">도면 연결</button>
      </div>
      <div class="source-actions">
        <button id="applyDetectionButton" class="camera-button" type="button" hidden>감지 결과 적용</button>
        <button id="discardDetectionButton" class="file-button" type="button" hidden>감지 결과 취소</button>
      </div>
      <div class="canvas-wrap">
        <canvas id="calibrationCanvas" width="1280" height="720"></canvas>
        <p id="canvasPlaceholder">CCTV 사진을 선택하세요</p>
      </div>
      <div class="point-status">
        <strong id="slotProgress">B1-001</strong>
        <span id="pointProgress">모서리 0 / 4</span>
      </div>
      <section id="matchingPanel" hidden>
        <h2>도면 연결</h2>
        <p id="matchingStatus" role="status" aria-live="polite"></p>
        <svg id="matchingPlan" style="width:100%;max-height:480px;display:block" aria-label="연결할 도면 주차면"></svg>
      </section>
    </section>

    <section class="slot-settings">
      <div class="field-row">
        <label>층<input id="floorId" value="B1" maxlength="8"></label>
        <label>주차면 번호<input id="slotNumber" type="number" min="1" value="1"></label>
      </div>
      <div class="kind-control" aria-label="주차면 종류">
        <button class="active" data-kind="normal" type="button">일반</button>
        <button data-kind="disabled" type="button">장애인</button>
        <button data-kind="pregnant" type="button">임산부</button>
      </div>
      <div class="edit-actions">
        <button id="undoButton" type="button">되돌리기</button>
        <button id="saveButton" class="save-button" type="button">주차면 저장</button>
      </div>
      <button id="referenceButton" class="camera-button" type="button">현재 사진을 빈 주차장 기준으로 저장</button>
      <p id="saveStatus">도면의 주차면 번호와 맞춰 각 면의 모서리를 시계 방향으로 4번 누르세요. CCTV 위치를 고정한 상태에서 등록하세요.</p>
    </section>

    <section class="registered-section">
      <div class="section-title"><h2>등록된 주차면</h2><strong id="slotCount">0면</strong></div>
      <div id="slotList" class="slot-list"></div>
      <details>
        <summary>모델 학습 자료</summary>
        <div class="field-row">
          <label>촬영 그룹<input id="trainingGroup" placeholder="camera-1-day-1" maxlength="80"></label>
          <label>자료 구분<select id="trainingSplit"><option value="train">학습</option><option value="val">검증</option></select></label>
        </div>
        <button id="trainingSampleButton" class="camera-button" type="button">현재 사진·좌표를 학습 자료로 저장</button>
        <p id="trainingStatus" role="status" aria-live="polite"></p>
      </details>
    </section>
  </main>
  <script src="./config.js?v=4"></script>
  <script src="./calibrate.js?v=7"></script>
</body>
</html>
