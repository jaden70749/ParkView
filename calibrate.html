<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f8c400">
  <title>ParkView CCTV 주차면 설정</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="./calibrate.css?v=6">
</head>
<body>
  <main class="calibration-shell">
    <header class="setup-header">
      <div><p>ParkView 관리자</p><h1>CCTV 주차면 설정</h1></div>
      <span class="setup-badge">설치 전용</span>
    </header>

    <section class="source-section">
      <div class="section-heading">
        <span class="step-number">1</span>
        <div><h2>CCTV 영상 불러오기</h2><p>연결된 카메라의 현재 화면을 가져옵니다.</p></div>
      </div>
      <div class="source-primary">
        <button id="cameraFrameButton" class="camera-button" type="button">현재 CCTV 불러오기</button>
        <p id="sourceStatus" role="status" aria-live="polite">CCTV 영상을 불러오세요.</p>
      </div>
      <details class="setup-options">
        <summary>연결 및 불러오기 옵션</summary>
        <div class="setup-options-body">
          <form id="cameraConnectionForm" class="camera-connection-panel">
            <label class="camera-url-field">RTSP 카메라 링크
              <input id="cameraRtspUrl" type="password" placeholder="rtsp://사용자:비밀번호@카메라-IP:554/..." autocomplete="off" spellcheck="false">
            </label>
            <button id="cameraConnectButton" class="camera-button" type="submit">카메라 연결</button>
          </form>
          <p id="cameraConnectFeedback" class="connection-feedback" role="status" aria-live="polite"></p>
          <div class="source-actions">
            <label class="file-button" for="frameFile">사진에서 불러오기</label>
            <input id="frameFile" type="file" accept="image/*">
            <button id="reloadRegionsButton" class="file-button" type="button">저장 좌표 불러오기</button>
          </div>
          <details id="adminAuthDetails" class="compact-details connection-details">
            <summary>관리자 인증</summary>
            <label class="token-field">관리자 토큰<input id="adminToken" type="password" autocomplete="off"></label>
          </details>
        </div>
      </details>
    </section>

    <section class="editor-section">
      <div class="section-heading editor-heading">
        <span class="step-number">2</span>
        <div><h2>주차면 확인</h2><p>주차장 바깥 모서리 4개를 선택한 뒤 자동 감지를 누르세요.</p></div>
        <strong id="slotCount" class="count-badge">0면</strong>
      </div>

      <div class="editor-layout">
        <div class="canvas-column">
          <div class="editor-toolbar">
            <button id="detectButton" class="detect-button" type="button">주차면 자동 감지</button>
            <details class="editing-tools">
              <summary>직접 수정</summary>
              <div class="kind-control mode-control" aria-label="좌표 편집 모드">
                <button data-mode="region" aria-pressed="true" type="button">감지 영역</button>
                <button data-mode="add" aria-pressed="false" type="button">주차면 추가</button>
                <button data-mode="edit" aria-pressed="false" type="button">모서리 수정</button>
                <button data-mode="match" aria-pressed="false" type="button">도면 연결</button>
              </div>
            </details>
          </div>
          <div class="detection-actions">
            <button id="applyDetectionButton" class="camera-button" type="button" hidden>감지 결과 적용</button>
            <button id="discardDetectionButton" class="file-button" type="button" hidden>취소</button>
          </div>
          <div class="canvas-wrap">
            <canvas id="calibrationCanvas" width="1280" height="720"></canvas>
            <p id="canvasPlaceholder">먼저 CCTV 프레임을 불러오세요</p>
          </div>
          <div class="point-status">
            <strong id="slotProgress">B1-001</strong>
            <span id="pointProgress">모서리 0 / 4</span>
          </div>
          <section id="matchingPanel" class="matching-panel" hidden>
            <h3>도면 연결</h3>
            <p id="matchingStatus" role="status" aria-live="polite"></p>
            <svg id="matchingPlan" aria-label="연결할 도면 주차면"></svg>
          </section>
        </div>

        <aside class="slot-settings">
          <div class="panel-heading"><span class="step-number">3</span><h2>저장</h2></div>
          <div class="save-controls">
            <div class="field-row">
              <label>층<input id="floorId" value="B1" maxlength="8"></label>
              <label>주차면 번호<input id="slotNumber" type="number" min="1" value="1"></label>
            </div>
            <div class="kind-field">
              <span class="control-label">주차면 종류</span>
              <div class="kind-control" aria-label="주차면 종류">
                <button class="active" data-kind="normal" type="button">일반</button>
                <button data-kind="disabled" type="button">장애인</button>
                <button data-kind="pregnant" type="button">임산부</button>
              </div>
            </div>
            <div class="edit-actions">
              <button id="undoButton" class="undo-button" type="button">되돌리기</button>
              <button id="saveButton" class="save-button" type="button">저장</button>
            </div>
          </div>
          <p id="saveStatus">감지 결과를 확인한 뒤 저장하세요.</p>
          <details class="compact-details reference-details">
            <summary>점유 분석 기준</summary>
            <button id="referenceButton" class="secondary-command" type="button">현재 사진을 빈 주차장 기준으로 저장</button>
          </details>
        </aside>
      </div>
    </section>

    <section class="registered-section">
      <details class="registered-details">
        <summary><span>등록된 주차면</span><span>목록 보기</span></summary>
        <div id="slotList" class="slot-list"></div>
      </details>
      <details class="compact-details training-details">
        <summary>모델 학습 자료</summary>
        <div class="field-row">
          <label>촬영 그룹<input id="trainingGroup" placeholder="camera-1-day-1" maxlength="80"></label>
          <label>자료 구분<select id="trainingSplit"><option value="train">학습</option><option value="val">검증</option></select></label>
        </div>
        <button id="trainingSampleButton" class="secondary-command" type="button">현재 사진·좌표를 학습 자료로 저장</button>
        <p id="trainingStatus" role="status" aria-live="polite"></p>
      </details>
    </section>
  </main>
  <script src="./config.js?v=4"></script>
  <script src="./calibrate.js?v=17"></script>
</body>
</html>
