name: Deploy ParkView to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Prepare static site
        env:
          KAKAO_JAVASCRIPT_KEY: ${{ secrets.KAKAO_JAVASCRIPT_KEY }}
        run: |
          test -n "$KAKAO_JAVASCRIPT_KEY"
          mkdir -p _site/data
          cp index.html app.js styles.css manifest.webmanifest sw.js _site/
          cp data/parking-lots.json _site/data/
          node -e 'const fs = require("fs"); const config = { edgeApiBaseUrl: "", kakaoJavaScriptKey: process.env.KAKAO_JAVASCRIPT_KEY }; fs.writeFileSync("_site/config.js", `window.PARKVIEW_CONFIG = Object.freeze(${JSON.stringify(config)});\n`);'
          touch _site/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
